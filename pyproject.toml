[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rutgers-major-planner"
version = "0.1.0"
description = "Rutgers–New Brunswick major planner: career outcomes, Degree Navigator what-if, and a graduation path planner in one local website"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",          # the website
  "pyyaml>=6",           # planner configs and program files
  "httpx>=0.27",         # What-If: Degree Navigator JSON + Schedule of Classes downloads
  "beautifulsoup4>=4.12",# What-If: Degree Navigator HTML parsing
  "playwright>=1.45",    # What-If: the login / discovery browser window
]

[project.optional-dependencies]
# CP-SAT course selection and scheduling. Without it the planner falls back to a heuristic
# selection and the greedy scheduler. ortools publishes wheels for Python 3.10-3.14.
solver = ["ortools>=9.10"]
# Rebuilding the outcomes data (python -m pipeline.build). The site itself only reads the JSON.
pipeline = ["pandas>=2.2", "openpyxl>=3.1", "lxml>=5.0", "requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
rutgers-planner = "rutgers_planner.__main__:main"
rwi = "rutgers_whatif.cli:main"
gradplan = "gradplan.cli:main"

[tool.setuptools.packages.find]
include = ["rutgers_planner*", "rutgers_whatif*", "gradplan*", "pipeline*"]

[tool.setuptools.package-data]
rutgers_planner = ["templates/*.html", "templates/outcomes/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
rutgers_whatif = ["programs/*.json", "web/*.html"]
gradplan = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
